[project]
name = "dsa"
version = "0.1.0"
description = "Deep sports analysis: players, skeletons, ball and hits from tennis video (phone or TV), with off-the-shelf models."
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "rfdetr==1.10.1",
    "transformers==5.17.0",
    "supervision==0.30.3",
    "rtmlib==0.0.16",
    "onnx==1.23.2",
    "onnxconverter-common==1.16.0",
    "opencv-python==5.0.0.93",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "anthropic==1.8.0",
    "scenedetect==0.7.1",
    "yt-dlp==2026.8.19",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
cloud = ["modal==1.5.5"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsa = ["*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
